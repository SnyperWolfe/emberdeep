<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emberdeep Sprites</title>
  <style>html, body { margin: 0; background: #0d0f14; overflow: hidden; }</style>
</head>
<body>
  <script type="module">
    // Contact sheet of every sprite, animated, at 2x game scale over each ground type.
    import Phaser from '/vendor/phaser.js';
    import { ENEMIES } from '/shared/content.js';
    import * as art from './art.js';

    const groups = [
      ['Classes and NPCs', [...art.CATALOG.classes.map((c) => ['p', c]), ...art.CATALOG.npcs.map((r) => ['n', r])], 0],
      ['Open world', ['slime', 'boar', 'bandit', 'wolf', 'spider', 'thornling', 'imp', 'hound', 'golem', 'wisp', 'stalker', 'brute'].map((m) => ['m', m]), 0],
      ['Dungeons', ['skeleton', 'ghoul', 'bonearcher', 'regent', 'crawler', 'magmaimp', 'slag', 'magmaw', 'revenant', 'rimecaster', 'frostknight', 'vael'].map((m) => ['m', m]), 11],
    ];
    const GROUNDS = { 0: 0, 11: 11 };
    class Sheet extends Phaser.Scene {
      create() {
        art.makeTileset(this); art.dotTexture(this);
        const Z = 2, cellW = 96, cellH = 104;
        let y = 24, moving = new URLSearchParams(location.search).has('walk');
        const sprites = [];
        for (const [title, list, ground] of groups) {
          this.add.text(16, y, title, { fontFamily: 'system-ui', fontSize: '18px', color: '#f0b55a' });
          y += 28;
          const cols = 12, rows = Math.ceil(list.length / cols);
          const tex = this.textures.get('tiles').getSourceImage();
          for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
            const ts = art.TEX_TS + 2;
            this.add.image(16 + c * cellW, y + r * cellH, 'tiles').setCrop(1, ground * ts + 1, art.TEX_TS, art.TEX_TS).setOrigin(0).setDisplaySize(cellW, cellH).setVisible(false);
          }
          const bg = this.add.graphics(); bg.fillStyle(ground ? 0x4d495c : 0x4f8f3a, 1).fillRect(16, y, cols * cellW, rows * cellH);
          list.forEach(([k, id], i) => {
            const x = 16 + (i % cols) * cellW + cellW / 2, yy = y + Math.floor(i / cols) * cellH + cellH - 22;
            const def = ENEMIES[id], z = k === 'm' && def.boss ? 1.4 : 1;
            const key = k === 'p' ? art.playerTexture(this, id) : k === 'n' ? art.npcTexture(this, id) : art.mobTexture(this, id, def.shape, def.color);
            const img = this.add.image(x, yy, key, 0).setOrigin(0.5, 0.85).setScale(art.SPRITE_SCALE * Z * z);
            if (k === 'p') this.add.image(x, yy - 12 * Z, art.weaponTexture(this, id)).setOrigin(-0.3, 0.5).setScale(0.5 * Z);
            this.add.text(x, yy + 10, k === 'm' ? def.name : id, { fontFamily: 'system-ui', fontSize: '11px', color: '#fff', stroke: '#000', strokeThickness: 3 }).setOrigin(0.5, 0);
            sprites.push({ img, phase: i * 137 });
          });
          y += rows * cellH + 18;
        }
        this.add.image(16 + 11 * cellW - 40, 30, art.portalTexture(this, false)).setScale(1).setOrigin(0.5, 0.2);
        this.time.addEvent({ loop: true, delay: 50, callback: () => {
          const now = performance.now();
          for (const s of sprites) s.img.setFrame(moving ? [2, 0, 3, 0][Math.floor(now / 105) % 4] : Math.floor((now + s.phase) / 560) % 2);
        } });
      }
    }
    new Phaser.Game({ type: Phaser.AUTO, width: 1200, height: 760, backgroundColor: '#0d0f14', scene: [Sheet] });
  </script>
</body>
</html>
